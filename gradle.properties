# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure.
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Namespaces each library's R class, so your R class only contains your own resources.
android.nonTransitiveRClass=true

# AGP 9.1.0 is tested up to compileSdk 36.1. The official plugins compile against 37,
# so keep the two in sync rather than downgrading the SDK.
android.suppressUnsupportedCompileSdk=37