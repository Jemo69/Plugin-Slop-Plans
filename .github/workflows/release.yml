name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No android-actions/setup-android here on purpose: that action tries to
      # install the legacy "tools" package, which no longer exists in the SDK
      # repository, and the whole run dies with
      # "Failed to find package 'tools'". The runners already ship an Android SDK
      # with the licenses accepted, and AGP fetches anything else it needs.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The release APK is signed. The keystore and the passwords live in the
      # repository secrets, never in the repository itself.
      - name: Decode signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_BASE64" | base64 -di > "$RUNNER_TEMP/keys/slop-plans.jks"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/**
          retention-days: 7

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SLOP_KEYSTORE_PATH: ${{ runner.temp }}/keys/slop-plans.jks
          SLOP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SLOP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SLOP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            Download the APK below, install it, then enable it in
            Kvaesitso → Settings → Plugins → Slop Plans.

            It ships with demo mode on, so it works before you sign in.
            Open the plugin settings to point it at your server and sign in.
