name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: android-actions/setup-android@v3

      # The release APK is signed. The keystore and the passwords live in the
      # repository secrets, never in the repository itself.
      - name: Restore signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.keys
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.keys/slop-plans.jks

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/**
          retention-days: 7

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SLOP_KEYSTORE_PATH: ${{ runner.temp }}/slop-plans.jks
          SLOP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SLOP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SLOP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          cp ~/.keys/slop-plans.jks "$SLOP_KEYSTORE_PATH"
          ./gradlew :app:assembleRelease --stacktrace

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            Download the APK below, install it, then enable it in
            Kvaesitso → Settings → Plugins → Slop Plans.

            It ships with demo mode on, so it works before you sign in.
            Open the plugin settings to point it at your server and sign in.
